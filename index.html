<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0F1117">
  <title>Card Tracker - TripCount</title>

  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone para JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0F1117;
      color: #E8E8F0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      -webkit-tap-highlight-color: transparent;
    }
    input, select, textarea, button { font-family: inherit; }

    /* Corrección para desplegables en navegador de escritorio */
    select option {
      background-color: #1A1D27 !important;
      color: #E8E8F0 !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const STORAGE_KEY = "card_tracker_tripcount_v9";
    const MONTHS = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

    const DEFAULT_CATEGORIES = [
      "🛒 Supermercado", "🍽️ Restaurantes", "⛽ Gasolina", "📺 Suscripciones",
      "💊 Salud", "👕 Ropa", "🚌 Transporte", "🛍️ Compras online",
      "🏠 Suministros", "💵 Efectivo", "✈️ Viajes", "🎉 Ocio", "📦 Otros"
    ];

    const uid = () => Math.random().toString(36).slice(2, 9);
    const fmt = (n) => (typeof n === "number" ? n : 0).toFixed(2).replace(".", ",") + " €";

    const DEFAULT_STATE = {
      trips: [
        { id: "trip-1", name: "Viaje a Roma", year: 2026, month: 4 },
        { id: "trip-2", name: "Escapada Pirineos", year: 2025, month: 10 }
      ],
      selectedTripId: "trip-1",
      persons: [
        { id: "me", name: "Yo", color: "#6C63FF" },
        { id: "cris", name: "Cris", color: "#FF6B9D" },
        { id: "otros", name: "Otros", color: "#888888" }
      ],
      categories: DEFAULT_CATEGORIES,
      transactions: [],
      dismissed: [],
      githubToken: "",
      gistId: ""
    };

    function App() {
      const [state, setState] = useState(() => {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) {
            const parsed = JSON.parse(stored);
            if (parsed.persons) {
              parsed.persons = parsed.persons.map((p, i) => (p.id === "cris" || i === 1) ? { ...p, id: "cris", name: "Cris" } : p);
            }
            return { ...DEFAULT_STATE, ...parsed };
          }
        } catch (e) {}
        return DEFAULT_STATE;
      });

      const [tab, setTab] = useState("resumen");
      const [viewAs, setViewAs] = useState("me");
      const [history, setHistory] = useState([]);

      // Modales
      const [addTxModal, setAddTxModal] = useState(false);
      const [tokenModal, setTokenModal] = useState(false);
      const [tokenInput, setTokenInput] = useState(state.githubToken || "");
      const [syncing, setSyncing] = useState(false);

      const [tripModal, setTripModal] = useState({ open: false, mode: "create", id: null, name: "", year: new Date().getFullYear(), month: new Date().getMonth() });
      const [confirmModal, setConfirmModal] = useState({ open: false, title: "", message: "", onConfirm: null });

      // Añadir categoría inline
      const [creatingCat, setCreatingCat] = useState(false);
      const [newCatInput, setNewCatInput] = useState("");

      const EMPTY_TX_FORM = {
        description: "",
        date: new Date().toISOString().slice(0, 10),
        amount: "",
        category: "📦 Otros",
        tripId: state.selectedTripId || "trip-1"
      };
      const [txForm, setTxForm] = useState(EMPTY_TX_FORM);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }, [state]);

      const updateState = (fn) => {
        setState((prev) => {
          const next = typeof fn === "function" ? fn(prev) : fn;
          setHistory((h) => [...h.slice(-20), prev]);
          return next;
        });
      };

      const handleUndo = () => {
        if (history.length === 0) return;
        const last = history[history.length - 1];
        setHistory((h) => h.slice(0, h.length - 1));
        setState(last);
      };

      useEffect(() => {
        const onKey = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
            e.preventDefault();
            handleUndo();
          }
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [history]);

      // Guardar Token GitHub
      const handleSaveToken = async () => {
        if (!tokenInput.trim()) {
          updateState(s => ({ ...s, githubToken: "", gistId: "" }));
          setTokenModal(false);
          return;
        }
        setSyncing(true);
        try {
          const headers = { Authorization: `token ${tokenInput.trim()}`, "Content-Type": "application/json" };
          const body = {
            description: "CardTracker TripCount Sync Data",
            public: false,
            files: { "cardtracker_data.json": { content: JSON.stringify(state, null, 2) } }
          };
          let res;
          if (state.gistId) {
            res = await fetch(`https://api.github.com/gists/${state.gistId}`, { method: "PATCH", headers, body: JSON.stringify(body) });
          } else {
            res = await fetch("https://api.github.com/gists", { method: "POST", headers, body: JSON.stringify(body) });
          }
          const data = await res.json();
          if (data.id) {
            updateState(s => ({ ...s, githubToken: tokenInput.trim(), gistId: data.id }));
            alert("¡Token configurado y datos sincronizados!");
          } else {
            alert("Token inválido.");
          }
        } catch (e) {
          alert("Error de conexión al sincronizar.");
        } finally {
          setSyncing(false);
          setTokenModal(false);
        }
      };

      // Añadir Categoría nueva
      const handleAddCategory = () => {
        const val = newCatInput.trim();
        if (!val) return;
        const formatted = val.includes(" ") ? val : "🏷️ " + val;
        if (!state.categories.includes(formatted)) {
          updateState(s => ({ ...s, categories: [...s.categories, formatted] }));
        }
        setTxForm(f => ({ ...f, category: formatted }));
        setNewCatInput("");
        setCreatingCat(false);
      };

      // Gestión Viajes
      const handleSaveTrip = () => {
        if (!tripModal.name.trim()) return;
        if (tripModal.mode === "create") {
          const newTrip = { id: "trip-" + uid(), name: tripModal.name.trim(), year: parseInt(tripModal.year), month: parseInt(tripModal.month) };
          updateState(s => ({ ...s, trips: [newTrip, ...s.trips], selectedTripId: newTrip.id }));
        } else {
          updateState(s => ({
            ...s,
            trips: s.trips.map(t => t.id === tripModal.id ? { ...t, name: tripModal.name.trim(), year: parseInt(tripModal.year), month: parseInt(tripModal.month) } : t)
          }));
        }
        setTripModal({ open: false, mode: "create", id: null, name: "", year: new Date().getFullYear(), month: 0 });
      };

      const handleDeleteTrip = (tripId, tripName) => {
        setConfirmModal({
          open: true,
          title: "Eliminar Viaje",
          message: `¿Borrar "${tripName}" y todos sus gastos asociados?`,
          onConfirm: () => {
            updateState(s => {
              const remaining = s.trips.filter(t => t.id !== tripId);
              return {
                ...s,
                trips: remaining,
                selectedTripId: s.selectedTripId === tripId ? (remaining[0]?.id || "ALL") : s.selectedTripId,
                transactions: s.transactions.filter(t => t.tripId !== tripId)
              };
            });
            setConfirmModal({ open: false });
          }
        });
      };

      // Guardar Gasto
      const handleAddTx = () => {
        const amt = parseFloat(txForm.amount);
        if (!txForm.description.trim() || isNaN(amt) || amt <= 0) return;
        const targetTrip = txForm.tripId || state.selectedTripId || state.trips[0]?.id;
        const newTx = {
          id: uid(),
          tripId: targetTrip,
          date: txForm.date,
          description: txForm.description.trim(),
          amount: amt,
          category: txForm.category,
          splits: [
            { personId: "me", amount: amt / 2, paid: true },
            { personId: "cris", amount: amt / 2, paid: true }
          ]
        };
        updateState(s => ({ ...s, transactions: [newTx, ...s.transactions] }));
        setAddTxModal(false);
        setTxForm(EMPTY_TX_FORM);
      };

      const currentTrip = state.trips.find(t => t.id === state.selectedTripId) || { name: "Todos los Viajes", id: "ALL" };
      const filteredTx = state.selectedTripId === "ALL" ? state.transactions : state.transactions.filter(t => t.tripId === state.selectedTripId);

      const viewPerson = state.persons.find(p => p.id === viewAs) || state.persons[0];
      const viewTotal = filteredTx.reduce((acc, tx) => {
        const sp = tx.splits?.find(s => s.personId === viewAs);
        return acc + (sp ? sp.amount : 0);
      }, 0);
      const totalGross = filteredTx.reduce((a, tx) => a + tx.amount, 0);

      const tripsByYear = state.trips.reduce((acc, trip) => {
        const yr = trip.year || "Sin Año";
        if (!acc[yr]) acc[yr] = [];
        const tripTxs = state.transactions.filter(tx => tx.tripId === trip.id);
        acc[yr].push({ ...trip, totalAmount: tripTxs.reduce((s, tx) => s + tx.amount, 0), count: tripTxs.length });
        return acc;
      }, {});

      const yearsList = Object.keys(tripsByYear).sort((a, b) => b - a);

      return (
        <div style={S.root}>
          {/* Header Superior */}
          <header style={S.header}>
            <div style={S.headerInner}>
              <div>
                <div style={S.headerTitle}>💳 Card Tracker</div>
                <div style={S.headerSub}>Control de gastos personal</div>
              </div>

              {/* Selector de Viajes */}
              <div style={S.tripSelectorBar}>
                <span style={{ fontSize: 12, color: "#888" }}>Viaje:</span>
                <select
                  value={state.selectedTripId}
                  onChange={e => updateState(s => ({ ...s, selectedTripId: e.target.value }))}
                  style={S.tripSelect}
                >
                  <option value="ALL">📋 Todos los Viajes</option>
                  {state.trips.map(t => (
                    <option key={t.id} value={t.id}>{t.name} ({MONTHS[t.month || 0].slice(0,3)} {t.year})</option>
                  ))}
                </select>

                {state.selectedTripId !== "ALL" && (
                  <div style={{ display: "flex", gap: 4 }}>
                    <button onClick={() => setTripModal({ open: true, mode: "edit", id: currentTrip.id, name: currentTrip.name, year: currentTrip.year, month: currentTrip.month || 0 })} style={S.iconBtn} title="Editar">✏️</button>
                    <button onClick={() => handleDeleteTrip(currentTrip.id, currentTrip.name)} style={{ ...S.iconBtn, color: "#FF4D6A" }} title="Eliminar">🗑️</button>
                  </div>
                )}

                <button onClick={() => setTripModal({ open: true, mode: "create", id: null, name: "", year: new Date().getFullYear(), month: new Date().getMonth() })} style={S.tripAddBtn}>+ Viaje</button>
              </div>

              {/* Botones de Cabecera */}
              <div style={S.headerButtons}>
                <button style={{ ...S.uploadBtnAlt, borderColor: state.githubToken ? "#00C9A7" : "#6C63FF", color: state.githubToken ? "#00C9A7" : "#6C63FF" }} onClick={() => { setTokenInput(state.githubToken || ""); setTokenModal(true); }}>
                  🔑 {state.githubToken ? "Sync ON" : "Token"}
                </button>
                {history.length > 0 && <button style={S.uploadBtnAlt} onClick={handleUndo}>↩ Deshacer</button>}
                <button style={S.uploadBtnGreen} onClick={() => { setTxForm(f => ({ ...f, tripId: state.selectedTripId !== "ALL" ? state.selectedTripId : state.trips[0]?.id })); setAddTxModal(true); }}>+ Gasto</button>
              </div>
            </div>
          </header>

          {/* Navegación Principal */}
          <nav style={S.nav}>
            {[
              ["resumen", "📊 Resumen"],
              ["gastos", "💳 Gastos"],
              ["historial", "📚 Histórico / Años"],
              ["personas", "👥 Personas"],
              ["categorias", "🏷️ Categorías"]
            ].map(([k, l]) => (
              <button key={k} style={{ ...S.navBtn, ...(tab === k ? S.navBtnActive : {}) }} onClick={() => setTab(k)}>
                {l}
              </button>
            ))}
          </nav>

          <main style={S.main}>
            {/* VISTA: RESUMEN */}
            {tab === "resumen" && (
              <div>
                <div style={S.viewAsBar}>
                  <span style={S.viewAsLabel}>Ver como:</span>
                  <div style={S.viewAsOptions}>
                    {state.persons.filter(p => p.id !== "otros").map(p => (
                      <button key={p.id} onClick={() => setViewAs(p.id)}
                        style={{ ...S.viewAsBtn, ...(viewAs === p.id ? { background: viewPerson.color + "22", border: `1px solid ${viewPerson.color}`, color: viewPerson.color } : {}) }}>
                        <span style={{ ...S.personDotSm, background: p.color }} />{p.name}
                      </button>
                    ))}
                  </div>
                </div>

                <div style={S.statsGrid}>
                  <StatCard label={`Gasto de ${viewPerson.name}`} value={fmt(viewTotal)} accent={viewPerson.color} />
                  <StatCard label={`Gasto bruto (${currentTrip.name})`} value={fmt(totalGross)} accent="#888" />
                  <StatCard label="Por cobrar" value={fmt(0)} accent="#FF4D6A" />
                  <StatCard label="Transacciones" value={filteredTx.length} accent="#00C9A7" />
                </div>

                {filteredTx.length === 0 && <EmptyState icon="💳" text={`No hay gastos registrados en ${currentTrip.name}`} />}
              </div>
            )}

            {/* VISTA: GASTOS */}
            {tab === "gastos" && (
              <div>
                {filteredTx.length === 0 ? (
                  <EmptyState icon="💳" text={`Aún no hay gastos en ${currentTrip.name}`} />
                ) : (
                  filteredTx.map(tx => (
                    <div key={tx.id} style={S.txCard}>
                      <div style={S.txRow}>
                        <div style={{ flex: 1 }}>
                          <div style={S.txDesc}>{tx.description}</div>
                          <div style={S.txMeta}>{tx.date} · <span style={S.catChip}>{tx.category}</span></div>
                        </div>
                        <div style={{ textAlign: "right" }}>
                          <div style={S.txAmt}>{fmt(tx.amount)}</div>
                          <button onClick={() => updateState(s => ({ ...s, transactions: s.transactions.filter(t => t.id !== tx.id) }))} style={{ color: "#FF4D6A", border: "none", background: "none", cursor: "pointer", fontSize: 11, marginTop: 4 }}>Eliminar</button>
                        </div>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}

            {/* VISTA: HISTÓRICO POR AÑOS */}
            {tab === "historial" && (
              <div>
                {yearsList.map(year => (
                  <div key={year} style={S.card}>
                    <div style={{ ...S.cardTitle, color: "#FFB347" }}>📅 Año {year}</div>
                    {tripsByYear[year].map(trip => (
                      <div key={trip.id} style={{ display: "flex", alignItems: "center", justifyBetween: "space-between", padding: "10px 0", borderBottom: "1px solid #22253A" }}>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontWeight: 600 }}>{trip.name}</div>
                          <div style={{ fontSize: 12, color: "#666" }}>{MONTHS[trip.month || 0]} · {trip.count} gastos</div>
                        </div>
                        <div style={{ textAlign: "right", display: "flex", alignItems: "center", gap: 10 }}>
                          <span style={{ fontWeight: 700, color: "#6C63FF" }}>{fmt(trip.totalAmount)}</span>
                          <button onClick={() => setTripModal({ open: true, mode: "edit", id: trip.id, name: trip.name, year: trip.year, month: trip.month || 0 })} style={S.iconBtn}>✏️</button>
                          <button onClick={() => handleDeleteTrip(trip.id, trip.name)} style={{ ...S.iconBtn, color: "#FF4D6A" }}>🗑️</button>
                        </div>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
            )}

            {/* VISTA: PERSONAS */}
            {tab === "personas" && (
              <div>
                {state.persons.map(p => (
                  <div key={p.id} style={S.personCard}>
                    <div style={{ ...S.personDot, background: p.color }} />
                    <div style={{ flex: 1, fontWeight: 600 }}>{p.name}</div>
                  </div>
                ))}
              </div>
            )}

            {/* VISTA: CATEGORÍAS */}
            {tab === "categorias" && (
              <div>
                {state.categories.map(c => (
                  <div key={c} style={S.personCard}>
                    <span style={{ fontWeight: 500 }}>{c}</span>
                  </div>
                ))}
              </div>
            )}
          </main>

          {/* MODAL: AÑADIR GASTO MANUAL */}
          {addTxModal && (
            <div style={S.overlay}>
              <div style={S.modal}>
                <div style={S.modalTitle}>+ Añadir gasto manual</div>

                <div style={S.formGroup}>
                  <label style={S.formLabel}>Viaje asignado</label>
                  <select value={txForm.tripId} onChange={e => setTxForm({ ...txForm, tripId: e.target.value })} style={S.input}>
                    {state.trips.map(t => (
                      <option key={t.id} value={t.id}>{t.name} ({MONTHS[t.month || 0].slice(0,3)} {t.year})</option>
                    ))}
                  </select>
                </div>

                <div style={S.formGroup}>
                  <label style={S.formLabel}>Descripción</label>
                  <input style={S.input} placeholder="Ej: Cena cumpleaños" value={txForm.description} onChange={e => setTxForm({ ...txForm, description: e.target.value })} />
                </div>

                <div style={S.formRow}>
                  <div style={{ flex: 1 }}>
                    <label style={S.formLabel}>Fecha</label>
                    <input type="date" style={S.input} value={txForm.date} onChange={e => setTxForm({ ...txForm, date: e.target.value })} />
                  </div>
                  <div style={{ width: 130 }}>
                    <label style={S.formLabel}>Importe (€)</label>
                    <input type="number" step="0.01" style={S.input} placeholder="0,00" value={txForm.amount} onChange={e => setTxForm({ ...txForm, amount: e.target.value })} />
                  </div>
                </div>

                {/* Categorías con opción '+' */}
                <div style={S.formGroup}>
                  <label style={S.formLabel}>Categoría</label>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 6 }}>
                    {state.categories.map(cat => (
                      <button key={cat} onClick={() => setTxForm({ ...txForm, category: cat })}
                        style={{ ...S.catPill, ...(txForm.category === cat ? S.catPillActive : {}) }}>
                        {cat}
                      </button>
                    ))}

                    {!creatingCat ? (
                      <button onClick={() => setCreatingCat(true)} style={{ ...S.catPill, border: "1px dashed #6C63FF", color: "#6C63FF", fontWeight: 700 }}>
                        + Nueva
                      </button>
                    ) : (
                      <div style={{ display: "flex", gap: 4, width: "100%", marginTop: 4 }}>
                        <input
                          autoFocus
                          style={{ ...S.input, padding: "6px 10px", fontSize: 12 }}
                          placeholder="Nueva categoría..."
                          value={newCatInput}
                          onChange={e => setNewCatInput(e.target.value)}
                          onKeyDown={e => e.key === "Enter" && handleAddCategory()}
                        />
                        <button style={S.btnPrimary} onClick={handleAddCategory}>OK</button>
                        <button style={S.btnSecondary} onClick={() => setCreatingCat(false)}>✕</button>
                      </div>
                    )}
                  </div>
                </div>

                <div style={S.txActions}>
                  <button style={S.btnSecondary} onClick={() => setAddTxModal(false)}>Cancelar</button>
                  <button style={S.btnPrimary} onClick={handleAddTx}>Añadir gasto</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: TOKEN GITHUB */}
          {tokenModal && (
            <div style={S.overlay}>
              <div style={{ ...S.modal, maxWidth: 380 }}>
                <div style={S.modalTitle}>🔑 Sincronización Cross-Device</div>
                <div style={{ fontSize: 12, color: "#aaa", marginBottom: 12, lineHeight: 1.4 }}>
                  Pega tu GitHub Personal Access Token con permisos de <strong>gist</strong>.
                </div>
                <input
                  type="password"
                  style={{ ...S.input, fontFamily: "monospace", fontSize: 12, marginBottom: 16 }}
                  placeholder="ghp_xxxxxxxxxxxx"
                  value={tokenInput}
                  onChange={e => setTokenInput(e.target.value)}
                />
                <div style={S.txActions}>
                  <button style={S.btnSecondary} onClick={() => setTokenModal(false)}>Cancelar</button>
                  <button style={S.btnPrimary} onClick={handleSaveToken}>
                    {syncing ? "Guardando..." : "Guardar Token"}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: CREAR/EDITAR VIAJE */}
          {tripModal.open && (
            <div style={S.overlay}>
              <div style={{ ...S.modal, maxWidth: 360 }}>
                <div style={S.modalTitle}>{tripModal.mode === "create" ? "Nuevo Viaje" : "Editar Viaje"}</div>
                <div style={S.formGroup}>
                  <label style={S.formLabel}>Nombre del Viaje</label>
                  <input style={S.input} value={tripModal.name} onChange={e => setTripModal({ ...tripModal, name: e.target.value })} placeholder="Ej: Roma" />
                </div>
                <div style={S.formRow}>
                  <div style={{ flex: 1 }}>
                    <label style={S.formLabel}>Mes</label>
                    <select style={S.input} value={tripModal.month} onChange={e => setTripModal({ ...tripModal, month: e.target.value })}>
                      {MONTHS.map((m, idx) => <option key={m} value={idx}>{m}</option>)}
                    </select>
                  </div>
                  <div style={{ width: 100 }}>
                    <label style={S.formLabel}>Año</label>
                    <input type="number" style={S.input} value={tripModal.year} onChange={e => setTripModal({ ...tripModal, year: e.target.value })} />
                  </div>
                </div>
                <div style={S.txActions}>
                  <button style={S.btnSecondary} onClick={() => setTripModal({ open: false })}>Cancelar</button>
                  <button style={S.btnPrimary} onClick={handleSaveTrip}>Guardar</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: CONFIRMACIÓN */}
          {confirmModal.open && (
            <div style={S.overlay}>
              <div style={{ ...S.modal, maxWidth: 360 }}>
                <div style={S.modalTitle}>{confirmModal.title}</div>
                <div style={{ fontSize: 13, color: "#aaa", marginBottom: 16 }}>{confirmModal.message}</div>
                <div style={S.txActions}>
                  <button style={S.btnSecondary} onClick={() => setConfirmModal({ open: false })}>Cancelar</button>
                  <button style={S.btnDanger} onClick={confirmModal.onConfirm}>Eliminar</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function StatCard({ label, value, accent }) {
      return (
        <div style={{ ...S.statCard, borderTop: `3px solid ${accent}` }}>

          <div style={S.statLabel}>{label}</div>
        </div>
      );
    }

    function EmptyState({ icon, text }) {
      return <div style={S.empty}><div style={{ fontSize: 40, marginBottom: 12 }}>{icon}</div><div style={{ color: "#666" }}>{text}</div></div>;
    }
