<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>TripCount</title>

  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone para JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .hover-row:hover { background-color: rgba(255, 255, 255, 0.03); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100 flex flex-col justify-between antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const STORAGE_KEY = "tripcount_app_data_v4";
    const MONTHS = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

    const DEFAULT_CATEGORIES = [
      "🛒 Supermercado", "🍽️ Restaurantes", "⛽ Gasolina", "📺 Suscripciones",
      "💊 Salud", "👕 Ropa", "🚌 Transporte", "🛍️ Compras online",
      "🏠 Alojamiento", "💵 Efectivo", "✈️ Vuelos/Viajes", "🎉 Ocio/Entradas", "📦 Otros"
    ];

    const uid = () => Math.random().toString(36).slice(2, 9);
    const fmt = (n) => (typeof n === "number" ? n : 0).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });

    const DEFAULT_STATE = {
      trips: [
        { id: "trip-1", name: "Viaje a Roma", year: 2026, month: 4 },
        { id: "trip-2", name: "Escapada Pirineos", year: 2025, month: 10 }
      ],
      selectedTripId: "trip-1",
      persons: [
        { id: "p-1", name: "Yo", color: "#6366f1" },
        { id: "p-2", name: "Cris", color: "#ec4899" },
        { id: "p-3", name: "Otros", color: "#64748b" }
      ],
      categories: DEFAULT_CATEGORIES,
      transactions: [
        {
          id: "tx-1", tripId: "trip-1", date: "2026-05-12", description: "Hotel Quirinale Roma", amount: 340.00, category: "🏠 Alojamiento",
          splits: [{ personId: "p-1", amount: 170.00, paid: true }, { personId: "p-2", amount: 170.00, paid: true }]
        },
        {
          id: "tx-2", tripId: "trip-1", date: "2026-05-13", description: "Cena Trattoria Da Enzo", amount: 68.50, category: "🍽️ Restaurantes",
          splits: [{ personId: "p-1", amount: 34.25, paid: true }, { personId: "p-2", amount: 34.25, paid: false }]
        }
      ],
      githubToken: "", gistId: ""
    };

    function App() {
      const [state, setState] = useState(() => {
        try {
          const local = localStorage.getItem(STORAGE_KEY);
          if (local) {
            const parsed = JSON.parse(local);
            if (parsed.persons) {
              parsed.persons = parsed.persons.map((p, idx) => (p.id === "p-2" || idx === 1) ? { ...p, id: "p-2", name: "Cris" } : p);
            }
            if (parsed.trips) {
              parsed.trips = parsed.trips.map(t => ({ ...t, month: t.month ?? 0 }));
            }
            return { ...DEFAULT_STATE, ...parsed };
          }
        } catch (e) {}
        return DEFAULT_STATE;
      });

      const [history, setHistory] = useState([]);
      const [activeTab, setActiveTab] = useState("resumen");
      const [viewAs, setViewAs] = useState("p-1");
      const [expandedCat, setExpandedCat] = useState(null);
      const [yearFilter, setYearFilter] = useState("ALL");

      // Modales
      const [showTokenModal, setShowTokenModal] = useState(false);
      const [tokenInput, setTokenInput] = useState(state.githubToken || "");
      const [syncing, setSyncing] = useState(false);
      const [confirmModal, setConfirmModal] = useState({ open: false, title: "", message: "", onConfirm: null });

      const [addTxModal, setAddTxModal] = useState(false);
      const [tripModal, setTripModal] = useState({ open: false, mode: "create", id: null, name: "", year: new Date().getFullYear(), month: new Date().getMonth() });
      const [calcModal, setCalcModal] = useState(false);
      
      // Conversor
      const [calcAmount, setCalcAmount] = useState("");
      const [calcRate, setCalcRate] = useState("1.08"); // p.ej. USD por EUR

      const [txForm, setTxForm] = useState({ description: "", amount: "", date: new Date().toISOString().slice(0, 10), category: "📦 Otros", tripId: state.selectedTripId || "" });

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }, [state]);

      const updateState = (newStateOrFn) => {
        setState((prev) => {
          const next = typeof newStateOrFn === "function" ? newStateOrFn(prev) : newStateOrFn;
          setHistory((h) => [...h.slice(-20), prev]);
          return next;
        });
      };

      const handleUndo = () => {
        if (history.length === 0) return;
        const lastState = history[history.length - 1];
        setHistory((h) => h.slice(0, h.length - 1));
        setState(lastState);
      };

      // Guardar / Editar Viaje
      const handleSaveTrip = () => {
        if (!tripModal.name.trim()) return;
        if (tripModal.mode === "create") {
          const newTrip = {
            id: "trip-" + uid(),
            name: tripModal.name.trim(),
            year: parseInt(tripModal.year) || new Date().getFullYear(),
            month: parseInt(tripModal.month) || 0
          };
          updateState((s) => ({ ...s, trips: [newTrip, ...s.trips], selectedTripId: newTrip.id }));
        } else {
          updateState((s) => ({
            ...s,
            trips: s.trips.map(t => t.id === tripModal.id ? { ...t, name: tripModal.name.trim(), year: parseInt(tripModal.year), month: parseInt(tripModal.month) } : t)
          }));
        }
        setTripModal({ open: false, mode: "create", id: null, name: "", year: new Date().getFullYear(), month: 0 });
      };

      // Eliminar Viaje
      const handleDeleteTrip = (tripId, tripName) => {
        setConfirmModal({
          open: true,
          title: "Eliminar Viaje",
          message: `¿Borrar "${tripName}" y todos sus gastos asociados?`,
          onConfirm: () => {
            updateState((s) => {
              const remainingTrips = s.trips.filter(t => t.id !== tripId);
              return {
                ...s,
                trips: remainingTrips,
                selectedTripId: s.selectedTripId === tripId ? (remainingTrips[0]?.id || "ALL") : s.selectedTripId,
                transactions: s.transactions.filter(t => t.tripId !== tripId)
              };
            });
            setConfirmModal({ open: false });
          }
        });
      };

      const currentTrip = state.trips.find((t) => t.id === state.selectedTripId) || { name: "Todos los Viajes", id: "ALL" };
      const filteredTransactions = state.selectedTripId === "ALL" ? state.transactions : state.transactions.filter((t) => t.tripId === state.selectedTripId);

      const viewPerson = state.persons.find((p) => p.id === viewAs) || state.persons[0];
      const totalTripGross = filteredTransactions.reduce((acc, t) => acc + (t.amount || 0), 0);
      const viewTotalShare = filteredTransactions.reduce((acc, t) => {
        const sp = t.splits?.find((s) => s.personId === viewAs);
        return acc + (sp ? sp.amount : 0);
      }, 0);

      const pendingBalance = filteredTransactions.reduce((acc, t) => {
        const sp = t.splits?.find((s) => s.personId === viewAs);
        return acc + (sp && !sp.paid ? sp.amount : 0);
      }, 0);

      // Días únicos con gastos para calcular media diaria
      const uniqueDays = new Set(filteredTransactions.map(t => t.date)).size || 1;
      const dailyAverage = totalTripGross / uniqueDays;

      const byCategory = {};
      filteredTransactions.forEach((tx) => {
        const sp = tx.splits?.find((s) => s.personId === viewAs);
        byCategory[tx.category] = (byCategory[tx.category] || 0) + (sp ? sp.amount : 0);
      });
      const catEntries = Object.entries(byCategory).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);

      const tripsByYear = state.trips.reduce((acc, trip) => {
        const yr = trip.year || "Sin Año";
        if (!acc[yr]) acc[yr] = [];
        const tripTxs = state.transactions.filter((tx) => tx.tripId === trip.id);
        acc[yr].push({ ...trip, totalAmount: tripTxs.reduce((sum, tx) => sum + tx.amount, 0), count: tripTxs.length });
        return acc;
      }, {});

      const yearsList = Object.keys(tripsByYear).sort((a, b) => b - a);

      const handleAddTransaction = () => {
        const amt = parseFloat(txForm.amount);
        if (!txForm.description.trim() || isNaN(amt) || amt <= 0) return;
        const newTx = {
          id: "tx-" + uid(), tripId: txForm.tripId || state.selectedTripId, date: txForm.date,
          description: txForm.description.trim(), amount: amt, category: txForm.category,
          splits: [{ personId: "p-1", amount: amt / 2, paid: true }, { personId: "p-2", amount: amt / 2, paid: true }]
        };
        updateState((s) => ({ ...s, transactions: [newTx, ...s.transactions] }));
        setAddTxModal(false);
        setTxForm({ description: "", amount: "", date: new Date().toISOString().slice(0, 10), category: "📦 Otros", tripId: state.selectedTripId });
      };

      return (
        <div class="min-h-screen flex flex-col justify-between max-w-4xl mx-auto px-4 py-3">
          {/* Header */}
          <header class="flex flex-col md:flex-row md:items-center justify-between gap-3 border-b border-slate-800 pb-3">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="text-2xl">✈️</span>
                <h1 class="text-xl font-bold text-slate-100 tracking-tight">TripCount</h1>
              </div>
              <div class="flex items-center gap-2 md:hidden">
                <button onClick={() => setCalcModal(true)} class="p-1.5 text-xs bg-slate-800 rounded-lg border border-slate-700">💱</button>
                {history.length > 0 && <button onClick={handleUndo} class="px-2 py-1 text-xs bg-slate-800 text-slate-300 rounded-lg border border-slate-700">↩</button>}
              </div>
            </div>

            {/* Selector y Gestión del Viaje */}
            <div class="flex items-center gap-1.5 bg-slate-800/80 p-1.5 rounded-xl border border-slate-700/60">
              <span class="text-xs text-slate-400 pl-1 font-medium">Viaje:</span>
              <select
                value={state.selectedTripId}
                onChange={(e) => updateState((s) => ({ ...s, selectedTripId: e.target.value }))}
                class="bg-slate-900 text-slate-200 text-xs font-semibold rounded-lg px-2 py-1 outline-none border border-slate-700 flex-1 max-w-[180px] truncate"
              >
                <option value="ALL">📋 Todos los Viajes</option>
                {state.trips.map((t) => (
                  <option key={t.id} value={t.id}>{t.name} ({MONTHS[t.month || 0].slice(0,3)} {t.year})</option>
                ))}
              </select>

              {state.selectedTripId !== "ALL" && (
                <>
                  <button
                    onClick={() => setTripModal({ open: true, mode: "edit", id: currentTrip.id, name: currentTrip.name, year: currentTrip.year, month: currentTrip.month || 0 })}
                    class="p-1 text-slate-400 hover:text-indigo-400 text-xs" title="Editar Nombre/Fecha"
                  >
                    ✏️
                  </button>
                  <button
                    onClick={() => handleDeleteTrip(currentTrip.id, currentTrip.name)}
                    class="p-1 text-slate-400 hover:text-rose-400 text-xs" title="Eliminar Viaje"
                  >
                    🗑️
                  </button>
                </>
              )}

              <button
                onClick={() => setTripModal({ open: true, mode: "create", id: null, name: "", year: new Date().getFullYear(), month: new Date().getMonth() })}
                class="px-2 py-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg shadow-sm"
              >
                + Nuevo
              </button>
            </div>

            <div class="hidden md:flex items-center gap-2">
              <button onClick={() => setCalcModal(true)} class="px-2.5 py-1.5 text-xs bg-slate-800 text-slate-300 rounded-lg border border-slate-700 hover:bg-slate-700">💱 Divisas</button>
              {history.length > 0 && <button onClick={handleUndo} class="px-2.5 py-1.5 text-xs bg-slate-800 text-slate-300 rounded-lg border border-slate-700">↩ Deshacer</button>}
              <button onClick={() => { setTxForm(f => ({ ...f, tripId: state.selectedTripId })); setAddTxModal(true); }} class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg shadow-sm">
                + Añadir Gasto
              </button>
            </div>
          </header>

          {/* Navegación */}
          <nav class="flex overflow-x-auto gap-1 border-b border-slate-800 my-3 pb-1 text-sm font-medium">
            {[["resumen", "📊 Resumen"], ["gastos", "💳 Gastos"], ["historial", "📚 Histórico / Años"], ["personas", "👥 Integrantes"], ["categorias", "🏷️ Categorías"]].map(([k, label]) => (
              <button
                key={k} onClick={() => setActiveTab(k)}
                class={`px-3 py-1.5 rounded-lg whitespace-nowrap transition-colors ${activeTab === k ? "bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 font-semibold" : "text-slate-400 hover:text-slate-200"}`}
              >
                {label}
              </button>
            ))}
          </nav>

          {/* Tab 1: Resumen */}
          {activeTab === "resumen" && (
            <div class="space-y-4">
              <div class="flex items-center justify-between bg-slate-800/40 p-3 rounded-xl border border-slate-800">
                <span class="text-xs text-slate-400">Ver balance como:</span>
                <div class="flex gap-2">
                  {state.persons.filter(p => p.id !== "p-3").map((p) => (
                    <button
                      key={p.id} onClick={() => setViewAs(p.id)}
                      class={`flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium border ${viewAs === p.id ? "bg-indigo-600/20 text-indigo-300 border-indigo-500" : "border-slate-700 text-slate-400"}`}
                    >
                      <span class="w-2 h-2 rounded-full" style={{ backgroundColor: p.color }}></span>{p.name}
                    </button>
                  ))}
                </div>
              </div>

              <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div class="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700/50">
                  <span class="text-xs text-slate-400 block mb-1">Total Viaje</span>
                  <span class="text-lg font-bold text-slate-100">{fmt(totalTripGross)}</span>
                </div>
                <div class="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700/50">
                  <span class="text-xs text-slate-400 block mb-1">Cuota {viewPerson.name}</span>
                  <span class="text-lg font-bold text-indigo-400">{fmt(viewTotalShare)}</span>
                </div>
                <div class="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700/50">
                  <span class="text-xs text-slate-400 block mb-1">Media / Día activo</span>
                  <span class="text-lg font-bold text-amber-400">{fmt(dailyAverage)}</span>
                </div>
                <div class="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700/50">
                  <span class="text-xs text-slate-400 block mb-1">Pendiente ajuste</span>
                  <span class={`text-lg font-bold ${pendingBalance > 0 ? "text-rose-400" : "text-emerald-400"}`}>{fmt(pendingBalance)}</span>
                </div>
              </div>

              {/* Lista por categorías */}
              <div class="bg-slate-800/40 p-4 rounded-xl border border-slate-800">
                <h3 class="text-sm font-semibold text-slate-200 mb-3">Gastos por Categoría</h3>
                {catEntries.length === 0 ? <p class="text-xs text-slate-500 italic py-2 text-center">Sin gastos registrados.</p> : catEntries.map(([cat, amt]) => (
                  <div key={cat} class="border-b border-slate-800/80 pb-2 mb-1">
                    <div class="flex justify-between text-xs py-1">
                      <span class="text-slate-300 font-medium">{cat}</span>
                      <span class="font-semibold text-slate-200">{fmt(amt)}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Tab 2: Gastos */}
          {activeTab === "gastos" && (
            <div class="space-y-3">
              {filteredTransactions.map((tx) => (
                <div key={tx.id} class="bg-slate-800/50 p-3.5 rounded-xl border border-slate-700/60 flex justify-between items-center">
                  <div>
                    <h4 class="text-sm font-semibold text-slate-100">{tx.description}</h4>
                    <span class="text-xs text-slate-400">{tx.date} • {tx.category}</span>
                  </div>
                  <div class="text-right">
                    <span class="text-base font-bold text-slate-100 block">{fmt(tx.amount)}</span>
                    <button onClick={() => updateState(s => ({ ...s, transactions: s.transactions.filter(t => t.id !== tx.id) }))} class="text-[11px] text-rose-400 hover:underline">Eliminar</button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Tab 3: Histórico por Años y Meses */}
          {activeTab === "historial" && (
            <div class="space-y-4">
              {yearsList.map((year) => (
                <div key={year} class="bg-slate-800/30 p-4 rounded-xl border border-slate-800 space-y-3">
                  <h3 class="text-base font-bold text-amber-400">📅 Año {year}</h3>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {tripsByYear[year].map((trip) => (
                      <div key={trip.id} class="p-3 bg-slate-900/60 rounded-xl border border-slate-800 flex justify-between items-center">
                        <div>
                          <h4 class="text-sm font-semibold text-slate-100">{trip.name}</h4>
                          <span class="text-xs text-slate-500">{MONTHS[trip.month || 0]} • {trip.count} gastos</span>
                        </div>
                        <div class="flex items-center gap-2">
                          <span class="text-sm font-bold text-indigo-300">{fmt(trip.totalAmount)}</span>
                          <button onClick={() => setTripModal({ open: true, mode: "edit", id: trip.id, name: trip.name, year: trip.year, month: trip.month || 0 })} class="text-xs text-slate-500 hover:text-slate-300">✏️</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* MODAL: Crear/Editar Viaje */}
          {tripModal.open && (
            <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 w-full max-w-sm space-y-4">
                <h3 class="text-base font-bold text-slate-100">{tripModal.mode === "create" ? "Crear Nuevo Viaje" : "Editar Viaje"}</h3>
                <div class="space-y-3 text-xs">
                  <div>
                    <label class="block text-slate-400 mb-1">Nombre del Viaje</label>
                    <input
                      type="text" value={tripModal.name} onChange={(e) => setTripModal({ ...tripModal, name: e.target.value })}
                      class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-slate-200 outline-none"
                    />
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block text-slate-400 mb-1">Mes</label>
                      <select
                        value={tripModal.month} onChange={(e) => setTripModal({ ...tripModal, month: e.target.value })}
                        class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-slate-200 outline-none"
                      >
                        {MONTHS.map((m, idx) => <option key={m} value={idx}>{m}</option>)}
                      </select>
                    </div>
                    <div>
                      <label class="block text-slate-400 mb-1">Año</label>
                      <input
                        type="number" value={tripModal.year} onChange={(e) => setTripModal({ ...tripModal, year: e.target.value })}
                        class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-slate-200 outline-none"
                      />
                    </div>
                  </div>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                  <button onClick={() => setTripModal({ open: false })} class="px-3 py-1.5 text-xs text-slate-400">Cancelar</button>
                  <button onClick={handleSaveTrip} class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg">Guardar</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: Conversor de divisas */}
          {calcModal && (
            <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 w-full max-w-sm space-y-3 text-xs">
                <h3 class="text-sm font-bold text-slate-100">💱 Conversor Rápido a EUR</h3>
                <div>
                  <label class="block text-slate-400 mb-1">Monto en divisa extranjera</label>
                  <input type="number" value={calcAmount} onChange={(e) => setCalcAmount(e.target.value)} placeholder="Ej. 150" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-slate-200" />
                </div>
                <div>
                  <label class="block text-slate-400 mb-1">Tasa de cambio (1 EUR = X Moneda)</label>
                  <input type="number" step="0.01" value={calcRate} onChange={(e) => setCalcRate(e.target.value)} class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-slate-200" />
                </div>
                <div class="p-3 bg-slate-800/80 rounded-xl text-center">
                  <span class="text-slate-400 block text-[10px]">Resultado estimado:</span>
                  <span class="text-lg font-bold text-emerald-400">{fmt((parseFloat(calcAmount) || 0) / (parseFloat(calcRate) || 1))}</span>
                </div>
                <div class="flex justify-end">
                  <button onClick={() => setCalcModal(false)} class="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-lg">Cerrar</button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: Confirmación */}
          {confirmModal.open && (
            <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 w-full max-w-sm space-y-3">
                <h3 class="text-sm font-bold text-slate-100">{confirmModal.title}</h3>
                <p class="text-xs text-slate-400">{confirmModal.message}</p>
                <div class="flex justify-end gap-2 pt-2">
                  <button onClick={() => setConfirmModal({ open: false })} class="px-3 py-1.5 text-xs text-slate-400">Cancelar</button>
                  <button onClick={confirmModal.onConfirm} class="px-3 py-1.5 bg-rose-600 text-white text-xs font-semibold rounded-lg">Confirmar</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
