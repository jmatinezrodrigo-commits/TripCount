<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>TripCount - Gestión Inteligente de Gastos</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#151f32',
              900: '#0f172a',
              950: '#090d16',
            },
            brand: {
              500: '#6366f1',
              600: '#4f46e5',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom scrollbar and animations */
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .editable-input:focus {
      outline: 2px solid #6366f1;
      background-color: #1e293b;
    }
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const STORAGE_KEY = 'tripcount_data_v1';
    const GIST_TOKEN_KEY = 'tripcount_gist_token';
    const GIST_ID_KEY = 'tripcount_gist_id';

    const DEFAULT_CATEGORIES = [
      "🛒 Supermercado", "🍽️ Restaurantes", "⛽ Gasolina", "📺 Suscripciones",
      "💊 Salud", "👕 Ropa", "🚌 Transporte", "🛍️ Compras Online",
      "🏠 Alojamiento", "💵 Efectivo", "✈️ Viajes", "🎉 Ocio", "📦 Otros"
    ];

    const DEFAULT_STATE = {
      transactions: [
        {
          id: "tx-1",
          date: new Date().toISOString().slice(0, 10),
          description: "Cena de bienvenida",
          amount: 85.50,
          category: "🍽️ Restaurantes",
          splits: [
            { personId: "p-me", amount: 42.75, paid: true },
            { personId: "p-2", amount: 42.75, paid: false }
          ]
        },
        {
          id: "tx-2",
          date: new Date().toISOString().slice(0, 10),
          description: "Supermercado compra semanal",
          amount: 64.20,
          category: "🛒 Supermercado",
          splits: [
            { personId: "p-me", amount: 64.20, paid: true }
          ]
        }
      ],
      dismissed: [],
      persons: [
        { id: "p-me", name: "Yo", color: "#6366f1" },
        { id: "p-2", name: "Cris", color: "#ec4899" },
        { id: "p-3", name: "Otros / Común", color: "#64748b" }
      ],
      categories: DEFAULT_CATEGORIES
    };

    const uid = () => 'id-' + Math.random().toString(36).substring(2, 9);
    const fmt = (n) => (typeof n === 'number' && !isNaN(n) ? n : 0).toFixed(2).replace('.', ',') + ' €';

    // Global Error Boundary Component
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("TripCount App Error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div class="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-slate-900 text-slate-100">
              <div class="text-5xl mb-4">⚠️</div>
              <h1 class="text-2xl font-bold mb-2">Algo salió mal en la aplicación</h1>
              <p class="text-slate-400 text-sm mb-6 max-w-md">Se ha producido un error inesperado al renderizar la interfaz.</p>
              <button 
                onClick={() => { localStorage.removeItem(STORAGE_KEY); window.location.reload(); }}
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2.5 rounded-xl shadow-lg transition">
                Restablecer Datos y Recargar
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function App() {
      // Data State & Undo Stack
      const [state, setState] = React.useState(() => {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) {
            const parsed = JSON.parse(stored);
            let persons = parsed.persons || DEFAULT_STATE.persons;
            
            // Migrate p-2 / second person name to siempre "Cris"
            persons = persons.map(p => p.id === "p-2" ? { ...p, name: "Cris" } : p);
            if (persons.length >= 2 && persons[1].id !== "p-me") {
              persons[1] = { ...persons[1], name: "Cris" };
            }

            return {
              transactions: parsed.transactions || [],
              dismissed: parsed.dismissed || [],
              persons: persons,
              categories: parsed.categories || DEFAULT_CATEGORIES
            };
          }
        } catch (e) {
          console.error("Error loading local storage", e);
        }
        return DEFAULT_STATE;
      });

      const [history, setHistory] = React.useState([]);
      const [saveStatus, setSaveStatus] = React.useState("Guardado local");
      const [activeTab, setActiveTab] = React.useState("resumen");
      
      // Sync & Modals State
      const [gistToken, setGistToken] = React.useState(() => localStorage.getItem(GIST_TOKEN_KEY) || "");
      const [gistId, setGistId] = React.useState(() => localStorage.getItem(GIST_ID_KEY) || "");
      const [isSyncing, setIsSyncing] = React.useState(false);
      const [showGistModal, setShowGistModal] = React.useState(false);

      const [showAddTxModal, setShowAddTxModal] = React.useState(false);
      const [showJsonModal, setShowJsonModal] = React.useState(false);
      const [jsonInputText, setJsonInputText] = React.useState("");

      const [confirmModal, setConfirmModal] = React.useState({ show: false, title: "", message: "", onConfirm: null });
      const [expandedTxId, setExpandedTxId] = React.useState(null);
      const [viewAsPerson, setViewAsPerson] = React.useState("p-me");

      // Custom transaction form state
      const [txForm, setTxForm] = React.useState({
        description: "",
        date: new Date().toISOString().slice(0, 10),
        amount: "",
        category: DEFAULT_CATEGORIES[0]
      });

      // Save state helper with Undo History Stack
      const updateState = (newStateOrFn, recordHistory = true) => {
        setState(prev => {
          const nextState = typeof newStateOrFn === 'function' ? newStateOrFn(prev) : newStateOrFn;
          if (recordHistory) {
            setHistory(h => [...h.slice(-20), prev]); // Keep last 20 steps
          }
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
            setSaveStatus("Guardado local ✓");
            setTimeout(() => setSaveStatus("Guardado local"), 2000);
          } catch (err) {
            console.error("Local storage save error", err);
          }
          return nextState;
        });
      };

      // Undo action
      const handleUndo = React.useCallback(() => {
        if (history.length === 0) return;
        const previous = history[history.length - 1];
        setHistory(h => h.slice(0, -1));
        setState(previous);
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(previous));
          setSaveStatus("Acción deshecha ↩");
          setTimeout(() => setSaveStatus("Guardado local"), 2000);
        } catch (e) {}
      }, [history]);

      // Keyboard shortcut Ctrl+Z / Cmd+Z listener
      React.useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            e.preventDefault();
            handleUndo();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [handleUndo]);

      // GitHub Gist Cloud Sync
      const handleSyncGist = async () => {
        if (!gistToken.trim()) {
          alert("Ingresa un Personal Access Token de GitHub válido.");
          return;
        }
        setIsSyncing(true);
        setSaveStatus("Sincronizando con Gist...");
        try {
          localStorage.setItem(GIST_TOKEN_KEY, gistToken);
          const headers = {
            "Authorization": `token ${gistToken}`,
            "Accept": "application/vnd.github.v3+json",
            "Content-Type": "application/json"
          };
          const gistContent = JSON.stringify(state, null, 2);

          if (gistId) {
            // Update existing Gist
            const res = await fetch(`https://api.github.com/gists/${gistId}`, {
              method: 'PATCH',
              headers,
              body: JSON.stringify({
                description: "TripCount Data Backup",
                files: { "tripcount_backup.json": { content: gistContent } }
              })
            });
            if (!res.ok) throw new Error("Error al actualizar Gist");
          } else {
            // Create new Gist
            const res = await fetch(`https://api.github.com/gists`, {
              method: 'POST',
              headers,
              body: JSON.stringify({
                description: "TripCount Data Backup",
                public: false,
                files: { "tripcount_backup.json": { content: gistContent } }
              })
            });
            if (!res.ok) throw new Error("Error al crear Gist");
            const data = await res.json();
            setGistId(data.id);
            localStorage.setItem(GIST_ID_KEY, data.id);
          }
          setSaveStatus("Sincronizado en la Nube ☁️");
          setShowGistModal(false);
        } catch (err) {
          console.error(err);
          alert("Error de sincronización con GitHub Gist: " + err.message);
          setSaveStatus("Error de sincronización ⚠️");
        } finally {
          setIsSyncing(false);
          setTimeout(() => setSaveStatus("Guardado local"), 3000);
        }
      };

      // Load from Gist
      const handleLoadGist = async () => {
        if (!gistToken || !gistId) {
          alert("Requiere Token y Gist ID configurados.");
          return;
        }
        setIsSyncing(true);
        try {
          const res = await fetch(`https://api.github.com/gists/${gistId}`, {
            headers: { "Authorization": `token ${gistToken}` }
          });
          if (!res.ok) throw new Error("No se pudo obtener el Gist");
          const data = await res.json();
          const content = data.files["tripcount_backup.json"]?.content;
          if (content) {
            const parsed = JSON.parse(content);
            updateState(parsed);
            alert("¡Datos cargados correctamente desde la nube!");
            setShowGistModal(false);
          }
        } catch (err) {
          alert("Error al cargar desde Gist: " + err.message);
        } finally {
          setIsSyncing(false);
        }
      };

      // Inline Editing handlers
      const handleUpdateTxDescription = (id, newDesc) => {
        if (!newDesc.trim()) return;
        updateState(prev => ({
          ...prev,
          transactions: prev.transactions.map(t => t.id === id ? { ...t, description: newDesc.trim() } : t)
        }));
      };

      const handleUpdateTxAmount = (id, newAmountStr) => {
        const val = parseFloat(newAmountStr.replace(',', '.'));
        if (isNaN(val) || val <= 0) return;
        updateState(prev => ({
          ...prev,
          transactions: prev.transactions.map(t => {
            if (t.id !== id) return t;
            const ratio = val / (t.amount || 1);
            const newSplits = t.splits.map(s => ({
              ...s,
              amount: parseFloat((s.amount * ratio).toFixed(2))
            }));
            return { ...t, amount: val, splits: newSplits };
          })
        }));
      };

      // Actions: Add Transaction, Delete & Restore
      const handleAddTransaction = () => {
        const amt = parseFloat(txForm.amount.replace(',', '.'));
        if (!txForm.description.trim() || isNaN(amt) || amt <= 0) {
          alert("Por favor introduce una descripción válida e importe mayor a 0.");
          return;
        }
        const newTx = {
          id: uid(),
          date: txForm.date || new Date().toISOString().slice(0, 10),
          description: txForm.description.trim(),
          amount: amt,
          category: txForm.category || "📦 Otros",
          splits: [{ personId: "p-me", amount: amt, paid: true }]
        };
        updateState(prev => ({ ...prev, transactions: [newTx, ...prev.transactions] }));
        setShowAddTxModal(false);
        setTxForm({ description: "", date: new Date().toISOString().slice(0, 10), amount: "", category: DEFAULT_CATEGORIES[0] });
      };

      const requestDeleteTx = (id) => {
        setConfirmModal({
          show: true,
          title: "Eliminar Transacción",
          message: "¿Estás seguro de mover este gasto a la papelera / desestimados?",
          onConfirm: () => {
            updateState(prev => {
              const txToDelete = prev.transactions.find(t => t.id === id);
              if (!txToDelete) return prev;
              return {
                ...prev,
                transactions: prev.transactions.filter(t => t.id !== id),
                dismissed: [txToDelete, ...prev.dismissed]
              };
            });
            setConfirmModal({ show: false });
          }
        });
      };

      const handleRestoreTx = (id) => {
        updateState(prev => {
          const restored = prev.dismissed.find(d => d.id === id);
          if (!restored) return prev;
          return {
            ...prev,
            dismissed: prev.dismissed.filter(d => d.id !== id),
            transactions: [restored, ...prev.transactions]
          };
        });
      };

      // JSON Import Handling
      const handleImportJson = () => {
        try {
          const parsed = JSON.parse(jsonInputText);
          const newTxs = Array.isArray(parsed) ? parsed : (parsed.transactions || []);
          if (!Array.isArray(newTxs)) throw new Error("Estructura JSON inválida");

          const formatted = newTxs.map(t => ({
            id: t.id || uid(),
            date: t.date || new Date().toISOString().slice(0, 10),
            description: t.description || "Sin descripción",
            amount: typeof t.amount === 'number' ? t.amount : parseFloat(t.amount) || 0,
            category: t.category || "📦 Otros",
            splits: t.splits || [{ personId: "p-me", amount: typeof t.amount === 'number' ? t.amount : 0, paid: true }]
          }));

          updateState(prev => ({ ...prev, transactions: [...formatted, ...prev.transactions] }));
          setShowJsonModal(false);
          setJsonInputText("");
          alert(`Se han importado ${formatted.length} transacciones.`);
        } catch (err) {
          alert("Error al parsear el JSON: " + err.message);
        }
      };

      // Calculated Totals
      const safeTransactions = state.transactions || [];
      const currentPerson = (state.persons || []).find(p => p.id === viewAsPerson) || (state.persons || [])[0] || { id: "p-me", name: "Yo", color: "#6366f1" };
      
      const totalGrossSpend = safeTransactions.reduce((acc, t) => acc + (t.amount || 0), 0);
      const personTotalSpend = safeTransactions.reduce((acc, t) => {
        const sp = (t.splits || []).find(s => s.personId === viewAsPerson);
        return acc + (sp ? sp.amount : 0);
      }, 0);

      const pendingToReceive = safeTransactions.reduce((acc, t) => {
        if (viewAsPerson === "p-me") {
          return acc + (t.splits || []).filter(s => s.personId !== "p-me" && !s.paid).reduce((sAcc, s) => sAcc + s.amount, 0);
        } else {
          const sp = (t.splits || []).find(s => s.personId === viewAsPerson);
          return acc + (sp && !sp.paid ? sp.amount : 0);
        }
      }, 0);

      // Aggregates by Category
      const catTotals = {};
      safeTransactions.forEach(t => {
        const cat = t.category || "📦 Otros";
        const sp = (t.splits || []).find(s => s.personId === viewAsPerson);
        const amt = sp ? sp.amount : 0;
        catTotals[cat] = (catTotals[cat] || 0) + amt;
      });

      return (
        <div class="max-w-2xl mx-auto flex flex-col min-h-screen pb-20">
          
          {/* Header */}
          <header class="bg-slate-850 border-b border-slate-800 sticky top-0 z-30 px-4 py-3 shadow-md">
            <div class="flex items-center justify-between">
              <div>
                <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                  <span class="p-1.5 bg-indigo-600 rounded-lg text-sm">✈️</span> TripCount
                </h1>
                <p class="text-xs text-slate-400 mt-0.5">{saveStatus}</p>
              </div>

              <div class="flex items-center gap-2">
                <button 
                  onClick={handleUndo}
                  disabled={history.length === 0}
                  title="Deshacer cambio (Ctrl+Z)"
                  class={`px-2.5 py-1.5 text-xs font-semibold rounded-lg border flex items-center gap-1 transition ${
                    history.length > 0 
                      ? 'bg-slate-800 border-slate-700 text-slate-200 hover:bg-slate-700' 
                      : 'bg-slate-900 border-slate-800 text-slate-600 cursor-not-allowed'
                  }`}>
                  ↩ Deshacer
                </button>

                <button 
                  onClick={() => setShowGistModal(true)}
                  title="Configurar Sincronización Gist"
                  class="p-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg text-amber-400 text-xs font-medium flex items-center gap-1">
                  🔑 Nube
                </button>

                <button 
                  onClick={() => setShowAddTxModal(true)}
                  class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-lg shadow-lg flex items-center gap-1 transition">
                  + Gasto
                </button>
              </div>
            </div>
          </header>

          {/* Navigation Tabs */}
          <nav class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-[57px] z-20 flex overflow-x-auto no-scrollbar">
            {[
              ["resumen", "📋 Resumen"],
              ["gastos", "💳 Gastos"],
              ["personas", "👥 Personas"],
              ["categorias", "🏷️ Categorías"],
              ["desestimados", "🗑️ Papelera"]
            ].map(([tabKey, label]) => (
              <button
                key={tabKey}
                onClick={() => setActiveTab(tabKey)}
                class={`px-4 py-3 text-xs font-semibold whitespace-nowrap border-b-2 transition flex items-center gap-1.5 ${
                  activeTab === tabKey
                    ? 'border-indigo-500 text-indigo-400 bg-slate-800/40'
                    : 'border-transparent text-slate-400 hover:text-slate-200'
                }`}>
                {label}
                {tabKey === 'desestimados' && (state.dismissed || []).length > 0 && (
                  <span class="ml-1 px-1.5 py-0.2 bg-rose-500/20 text-rose-400 text-[10px] rounded-full font-bold">
                    {(state.dismissed || []).length}
                  </span>
                )}
              </button>
            ))}
          </nav>

          {/* Main Body */}
          <main class="p-4 flex-1">
            
            {/* VIEW 1: RESUMEN COMBINADO */}
            {activeTab === "resumen" && (
              <div class="space-y-4">
                {/* View Person Selector */}
                <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-800 flex items-center justify-between">
                  <span class="text-xs text-slate-400 font-medium">Ver desglose para:</span>
                  <div class="flex gap-1.5 overflow-x-auto">
                    {(state.persons || []).map(p => (
                      <button
                        key={p.id}
                        onClick={() => setViewAsPerson(p.id)}
                        class={`px-2.5 py-1 text-xs rounded-lg font-medium transition flex items-center gap-1.5 ${
                          viewAsPerson === p.id 
                            ? 'bg-indigo-600 text-white shadow-md' 
                            : 'bg-slate-700/50 text-slate-300 hover:bg-slate-700'
                        }`}>
                        <span class="w-2 h-2 rounded-full" style={{ backgroundColor: p.color }}></span>
                        {p.name}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Stat Cards */}
                <div class="grid grid-cols-2 gap-3">
                  <div class="bg-slate-800/80 border border-slate-700/60 p-3.5 rounded-xl">
                    <span class="text-xs text-slate-400 block mb-1">Gasto de {currentPerson.name}</span>
                    <span class="text-xl font-bold text-indigo-400">{fmt(personTotalSpend)}</span>
                  </div>
                  <div class="bg-slate-800/80 border border-slate-700/60 p-3.5 rounded-xl">
                    <span class="text-xs text-slate-400 block mb-1">Gasto Bruto Total</span>
                    <span class="text-xl font-bold text-slate-200">{fmt(totalGrossSpend)}</span>
                  </div>
                  <div class="bg-slate-800/80 border border-slate-700/60 p-3.5 rounded-xl col-span-2 flex justify-between items-center">
                    <div>
                      <span class="text-xs text-slate-400 block">
                        {viewAsPerson === "p-me" ? "Pendiente de cobrar" : "Pendiente de abonar"}
                      </span>
                      <span class={`text-lg font-bold ${pendingToReceive > 0 ? 'text-rose-400' : 'text-emerald-400'}`}>
                        {fmt(pendingToReceive)}
                      </span>
                    </div>
                    <button 
                      onClick={() => setShowJsonModal(true)}
                      class="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs font-semibold text-slate-200 rounded-lg">
                      📥 Importar JSON
                    </button>
                  </div>
                </div>

                {/* Category Bars */}
                <div class="bg-slate-800/80 border border-slate-700/60 p-4 rounded-xl space-y-3">
                  <h3 class="text-sm font-semibold text-slate-200">Gastos por Categoría</h3>
                  {Object.keys(catTotals).length === 0 ? (
                    <p class="text-xs text-slate-500 py-4 text-center">No hay gastos registrados</p>
                  ) : (
                    Object.entries(catTotals)
                      .filter(([, val]) => val > 0)
                      .sort((a, b) => b[1] - a[1])
                      .map(([cat, val]) => {
                        const pct = personTotalSpend > 0 ? Math.min(100, (val / personTotalSpend) * 100) : 0;
                        return (
                          <div key={cat} class="space-y-1">
                            <div class="flex justify-between text-xs font-medium">
                              <span class="text-slate-300">{cat}</span>
                              <span class="text-slate-200 font-semibold">{fmt(val)}</span>
                            </div>
                            <div class="w-full h-2 bg-slate-700/60 rounded-full overflow-hidden">
                              <div class="h-full bg-indigo-500 rounded-full transition-all duration-300" style={{ width: `${pct}%` }}></div>
                            </div>
                          </div>
                        );
                      })
                  )}
                </div>
              </div>
            )}

            {/* VIEW 2: GASTOS */}
            {activeTab === "gastos" && (
              <div class="space-y-3">
                {safeTransactions.length === 0 ? (
                  <div class="text-center py-12 bg-slate-800/30 rounded-2xl border border-slate-800">
                    <p class="text-4xl mb-2">💳</p>
                    <p class="text-slate-400 text-sm">No hay transacciones guardadas</p>
                    <button 
                      onClick={() => setShowAddTxModal(true)}
                      class="mt-3 px-4 py-2 bg-indigo-600 text-xs font-semibold text-white rounded-xl">
                      Añadir primer gasto
                    </button>
                  </div>
                ) : (
                  safeTransactions.map(tx => (
                    <div key={tx.id} class="bg-slate-800/80 border border-slate-700/60 rounded-xl overflow-hidden transition">
                      <div 
                        onClick={() => setExpandedTxId(expandedTxId === tx.id ? null : tx.id)}
                        class="p-3.5 flex items-center justify-between cursor-pointer hover:bg-slate-700/30">
                        <div class="flex-1 min-w-0 pr-3">
                          {/* Editable Inline Title */}
                          <input
                            type="text"
                            value={tx.description}
                            onClick={e => e.stopPropagation()}
                            onChange={e => handleUpdateTxDescription(tx.id, e.target.value)}
                            class="bg-transparent font-semibold text-slate-100 text-sm w-full truncate border-b border-transparent hover:border-slate-600 focus:border-indigo-500 editable-input rounded px-1 py-0.5"
                          />
                          <div class="flex items-center gap-2 mt-1">
                            <span class="text-[11px] text-slate-400">{tx.date}</span>
                            <span class="text-[10px] px-2 py-0.5 bg-slate-700 rounded-md text-slate-300 font-medium">
                              {tx.category}
                            </span>
                          </div>
                        </div>

                        <div class="text-right flex items-center gap-2">
                          <div>
                            {/* Editable Inline Amount */}
                            <input
                              type="text"
                              onClick={e => e.stopPropagation()}
                              value={tx.amount}
                              onChange={e => handleUpdateTxAmount(tx.id, e.target.value)}
                              class="bg-transparent font-bold text-slate-100 text-sm text-right w-20 border-b border-transparent hover:border-slate-600 focus:border-indigo-500 editable-input rounded px-1 py-0.5"
                            />
                            <div class="text-[10px] text-slate-400">Total</div>
                          </div>
                          <span class="text-slate-500 text-xs">{expandedTxId === tx.id ? '▲' : '▼'}</span>
                        </div>
                      </div>

                      {/* Expanded Details */}
                      {expandedTxId === tx.id && (
                        <div class="px-3.5 pb-3.5 pt-2 border-t border-slate-700/50 bg-slate-850/50 space-y-2">
                          <p class="text-xs font-semibold text-slate-400 mb-1">Reparto del gasto:</p>
                          {(tx.splits || []).map(sp => {
                            const person = (state.persons || []).find(p => p.id === sp.personId);
                            return (
                              <div key={sp.personId} class="flex items-center justify-between text-xs py-1">
                                <div class="flex items-center gap-1.5">
                                  <span class="w-2 h-2 rounded-full" style={{ backgroundColor: person?.color || "#888" }}></span>
                                  <span class="text-slate-300">{person?.name || "Desconocido"}</span>
                                </div>
                                <div class="flex items-center gap-2">
                                  <span class="font-medium text-slate-200">{fmt(sp.amount)}</span>
                                  {sp.personId !== "p-me" && (
                                    <button
                                      onClick={() => {
                                        updateState(prev => ({
                                          ...prev,
                                          transactions: prev.transactions.map(t => {
                                            if (t.id !== tx.id) return t;
                                            return {
                                              ...t,
                                              splits: t.splits.map(s => s.personId === sp.personId ? { ...s, paid: !s.paid } : s)
                                            };
                                          })
                                        }));
                                      }}
                                      class={`px-2 py-0.5 text-[10px] rounded font-semibold ${
                                        sp.paid ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'
                                      }`}>
                                      {sp.paid ? '✓ Pagado' : 'Pendiente'}
                                    </button>
                                  )}
                                </div>
                              </div>
                            );
                          })}

                          <div class="pt-2 flex justify-end">
                            <button
                              onClick={() => requestDeleteTx(tx.id)}
                              class="px-2.5 py-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-xs font-medium rounded-lg border border-rose-500/20 transition">
                              🗑️ Mover a papelera
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  ))
                )}
              </div>
            )}

            {/* VIEW 3: PERSONAS */}
            {activeTab === "personas" && (
              <div class="space-y-3">
                {(state.persons || []).map(p => (
                  <div key={p.id} class="bg-slate-800/80 border border-slate-700/60 p-3.5 rounded-xl flex items-center justify-between">
                    <div class="flex items-center gap-2.5">
                      <span class="w-3 h-3 rounded-full" style={{ backgroundColor: p.color }}></span>
                      <span class="font-semibold text-sm text-slate-200">{p.name}</span>
                      {p.id === 'p-me' && <span class="text-[10px] px-1.5 py-0.2 bg-indigo-500/20 text-indigo-400 rounded font-semibold">Tú</span>}
                    </div>
                    <span class="text-xs text-slate-400">
                      ID: {p.id}
                    </span>
                  </div>
                ))}
              </div>
            )}

            {/* VIEW 4: CATEGORÍAS */}
            {activeTab === "categorias" && (
              <div class="grid grid-cols-2 gap-2">
                {(state.categories || []).map(cat => (
                  <div key={cat} class="bg-slate-800/80 border border-slate-700/60 p-3 rounded-xl text-xs font-medium text-slate-200 flex items-center justify-between">
                    <span>{cat}</span>
                  </div>
                ))}
              </div>
            )}

            {/* VIEW 5: DESESTIMADOS / PAPELERA */}
            {activeTab === "desestimados" && (
              <div class="space-y-3">
                {(state.dismissed || []).length === 0 ? (
                  <div class="text-center py-12 bg-slate-800/30 rounded-2xl border border-slate-800">
                    <p class="text-4xl mb-2">🗑️</p>
                    <p class="text-slate-400 text-sm">La papelera está vacía</p>
                  </div>
                ) : (
                  state.dismissed.map(d => (
                    <div key={d.id} class="bg-slate-800/50 border border-slate-700/40 p-3.5 rounded-xl flex items-center justify-between opacity-80">
                      <div>
                        <p class="text-xs font-semibold text-slate-300">{d.description}</p>
                        <p class="text-[11px] text-slate-500">{d.date} · {fmt(d.amount)}</p>
                      </div>
                      <button 
                        onClick={() => handleRestoreTx(d.id)}
                        class="px-2.5 py-1 bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500/30 text-xs font-semibold rounded-lg border border-emerald-500/30">
                        Restaurar
                      </button>
                    </div>
                  ))
                )}
              </div>
            )}

          </main>

          {/* GIST MODAL */}
          {showGistModal && (
            <div class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div class="bg-slate-850 border border-slate-700 rounded-2xl p-5 w-full max-w-md shadow-2xl space-y-4">
                <h3 class="text-base font-bold text-white flex items-center gap-2">🔑 Sincronización en la Nube (GitHub Gist)</h3>
                <p class="text-xs text-slate-400">Ingresa tu Personal Access Token de GitHub para realizar copias de seguridad de forma segura.</p>
                
                <div class="space-y-3">
                  <div>
                    <label class="text-xs text-slate-400 block mb-1">GitHub Personal Access Token</label>
                    <input 
                      type="password" 
                      value={gistToken} 
                      onChange={e => setGistToken(e.target.value)}
                      placeholder="ghp_xxxxxxxxxxxx"
                      class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500" 
                    />
                  </div>
                  <div>
                    <label class="text-xs text-slate-400 block mb-1">Gist ID (Opcional para actualizar)</label>
                    <input 
                      type="text" 
                      value={gistId} 
                      onChange={e => setGistId(e.target.value)}
                      placeholder="e.g. 8f921a..."
                      class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500" 
                    />
                  </div>
                </div>

                <div class="flex gap-2 pt-2">
                  <button 
                    onClick={handleSyncGist}
                    disabled={isSyncing}
                    class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs py-2.5 rounded-xl shadow transition">
                    {isSyncing ? "Guardando..." : "Subir a la Nube"}
                  </button>
                  {gistId && (
                    <button 
                      onClick={handleLoadGist}
                      disabled={isSyncing}
                      class="px-3 bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold text-xs py-2.5 rounded-xl transition">
                      Descargar
                    </button>
                  )}
                  <button 
                    onClick={() => setShowGistModal(false)}
                    class="px-3 bg-slate-800 text-slate-400 font-semibold text-xs py-2.5 rounded-xl transition">
                    Cerrar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ADD TX MODAL */}
          {showAddTxModal && (
            <div class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div class="bg-slate-850 border border-slate-700 rounded-2xl p-5 w-full max-w-md shadow-2xl space-y-3">
                <h3 class="text-base font-bold text-white">+ Agregar Nuevo Gasto</h3>
                
                <div>
                  <label class="text-xs text-slate-400 block mb-1">Descripción</label>
                  <input 
                    type="text" 
                    value={txForm.description}
                    onChange={e => setTxForm({ ...txForm, description: e.target.value })}
                    placeholder="Ej. Resto de taxi"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500"
                  />
                </div>

                <div class="grid grid-cols-2 gap-2">
                  <div>
                    <label class="text-xs text-slate-400 block mb-1">Importe (€)</label>
                    <input 
                      type="number" 
                      step="0.01"
                      value={txForm.amount}
                      onChange={e => setTxForm({ ...txForm, amount: e.target.value })}
                      placeholder="0.00"
                      class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div>
                    <label class="text-xs text-slate-400 block mb-1">Fecha</label>
                    <input 
                      type="date" 
                      value={txForm.date}
                      onChange={e => setTxForm({ ...txForm, date: e.target.value })}
                      class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                </div>

                <div>
                  <label class="text-xs text-slate-400 block mb-1">Categoría</label>
                  <select
                    value={txForm.category}
                    onChange={e => setTxForm({ ...txForm, category: e.target.value })}
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                    {DEFAULT_CATEGORIES.map(cat => (
                      <option key={cat} value={cat}>{cat}</option>
                    ))}
                  </select>
                </div>

                <div class="flex gap-2 pt-3">
                  <button 
                    onClick={handleAddTransaction}
                    class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs py-2.5 rounded-xl transition">
                    Guardar Gasto
                  </button>
                  <button 
                    onClick={() => setShowAddTxModal(false)}
                    class="px-4 bg-slate-800 text-slate-400 font-semibold text-xs py-2.5 rounded-xl transition">
                    Cancelar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* JSON IMPORT MODAL */}
          {showJsonModal && (
            <div class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div class="bg-slate-850 border border-slate-700 rounded-2xl p-5 w-full max-w-md shadow-2xl space-y-3">
                <h3 class="text-base font-bold text-white">📥 Importar JSON de Gastos</h3>
                <p class="text-xs text-slate-400">Pega un array o un objeto JSON con transacciones.</p>
                
                <textarea
                  rows="6"
                  value={jsonInputText}
                  onChange={e => setJsonInputText(e.target.value)}
                  placeholder='[{"description": "Cena", "amount": 25.5, "category": "🍽️ Restaurantes"}]'
                  class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono text-slate-100 focus:outline-none focus:border-indigo-500"
                ></textarea>

                <div class="flex gap-2">
                  <button 
                    onClick={handleImportJson}
                    class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs py-2.5 rounded-xl transition">
                    Procesar e Importar
                  </button>
                  <button 
                    onClick={() => setShowJsonModal(false)}
                    class="px-4 bg-slate-800 text-slate-400 font-semibold text-xs py-2.5 rounded-xl transition">
                    Cancelar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* CONFIRMATION MODAL */}
          {confirmModal.show && (
            <div class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div class="bg-slate-850 border border-slate-700 rounded-2xl p-5 w-full max-w-sm shadow-2xl space-y-3">
                <h3 class="text-base font-bold text-white">{confirmModal.title}</h3>
                <p class="text-xs text-slate-300">{confirmModal.message}</p>
                <div class="flex gap-2 pt-2">
                  <button 
                    onClick={confirmModal.onConfirm}
                    class="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-semibold text-xs py-2.5 rounded-xl transition">
                    Confirmar
                  </button>
                  <button 
                    onClick={() => setConfirmModal({ show: false })}
                    class="px-4 bg-slate-800 text-slate-400 font-semibold text-xs py-2.5 rounded-xl transition">
                    Cancelar
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
